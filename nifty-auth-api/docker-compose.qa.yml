version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.qa.conf:/etc/nginx/conf.d/default.conf:ro
      - ../NiftyOptionCalculator-Website-React/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always
    networks:
      - optix-qa

  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env.qa
    environment:
      - ENVIRONMENT=qa
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - optix-qa

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=optix
      - POSTGRES_PASSWORD=optix_qa_123
      - POSTGRES_DB=optix_qa
    volumes:
      - postgres_qa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optix -d optix_qa"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - optix-qa

  redis:
    image: redis:7-alpine
    volumes:
      - redis_qa_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - optix-qa

networks:
  optix-qa:
    driver: bridge

volumes:
  postgres_qa_data:
  redis_qa_data:
